# QQ机器人基础配置模板
# 复制此文件为 configs/base.yaml 并填写实际值

# 远程API配置(https://github.com/A8Cl233395/BingScraperApi)
REMOTE_API_URL: https://your-remote-api-url.com
REMOTE_WEBSOCKET_URI: ws://your-remote-api-url.com/link
REMOTE_API_KEY: your_remote_api_key_here

# 功能开关
ENABLE_OCR: true      # 启用图片OCR识别（需Umi-OCR服务）
ENABLE_STT: true      # 启用语音转文字（需阿里云API密钥）

# 机器人QQ号
SELF_ID: 123456789

# 大模型配置
MODELS:
  deepseek-v4-flash:
    api_type: chat-completions
    desc: "Deepseek V4 Flash"
    thinking:
      can_nonthink: true
      effort: high
    api_key: xxx
    url: https://opencode.ai/zen/go/v1
  deepseek-v4-pro:
    api_type: chat-completions
    desc: "Deepseek V4 Pro"
    api_key: xxx
    url: https://opencode.ai/zen/go/v1
  kimi-k2.6:
    api_type: chat-completions
    desc: "Kimi K2.6"
    vision: true
    # extra_header:                  # 可选，附加 HTTP 请求头
    #   X-Custom-Header: value
    # extra_body:                    # 可选，附加请求体参数，合并到所有请求
    #   temperature: 0.7
    api_key: xxx
    url: https://opencode.ai/zen/go/v1
  qwen3.7-plus:
    api_type: anthropic
    vision: true
    desc: "Qwen3.7 Plus"
    max_tokens: 8192
    thinking:
      can_nonthink: true
      on_param: enabled
      effort: high
    api_key: xxx
    url: https://opencode.ai/zen/go
  gpt-5.6-luna:
    api_type: responses
    desc: "GPT-5.6 Luna"
    vision: true
    thinking:
      can_nonthink: true
      effort: high
      request_summary: true
    api_key: xxx
    url: https://opencode.ai/zen/go/v1
  minimax-m3:
    api_type: anthropic
    desc: "Minimax M3"
    max_tokens: 8192
    vision: true
    thinking:
      can_nonthink: true
      on_param: adaptive
    api_key: xxx
    url: https://opencode.ai/zen/go
  qwen3.7-flash:
    api_type: chat-completions
    desc: "Qwen3.7 Flash"
    hidden: true
    thinking:
      extra_body:
        'true':
          enable_thinking: true
        'false':
          enable_thinking: false
    api_key: xxx
    url: https://dashscope.aliyuncs.com/compatible-mode/v1


LOG_LEVEL: INFO # 日志级别（DEBUG, INFO, WARNING, ERROR, CRITICAL）

ALLOW_ADD_BOT_WITH_TOKEN_VERIFIED: true # 是否允许添加机器人（需验证token）

ALLOW_WEBCHAT: true # 是否允许网页聊天
